<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Joe Burkinshaw">
  <!--
    Colours duplicate the ink and paper tokens from src/styles/global.css.
    An external SVG cannot read the document's custom properties, so this is the
    one place the palette is repeated. Keep the two in step.
  -->
  <style>
    .ground { fill: #17191b; }
    .figure { fill: #faf9f7; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #e9e7e3; }
      .figure { fill: #121416; }
    }
  </style>
  <rect class="ground" width="32" height="32" />
  <circle class="figure" cx="16" cy="16" r="7" />
</svg>
